<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    Превью иконки: тот же мотив, что в res/drawable/ic_launcher_{background,foreground}.xml.
    Сам иконкой является векторный XML, этот файл нужен чтобы на дизайн посмотреть:
      ./preview.sh        -> icon_circle.png / icon_squircle.png / icon_48.png
    Геометрия: мотив вписан в безопасную зону адаптивной иконки (круг r=36 вокруг 54,54).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171233"/><stop offset="0.5" stop-color="#2C1C63"/><stop offset="1" stop-color="#512E9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="54" cy="43" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B7BFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#9B7BFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="27.25" y1="0" x2="80.75" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B93FF"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <g id="art">
      <rect width="108" height="108" fill="url(#bg)"/>
      <rect width="108" height="108" fill="url(#glow)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round">
        <path d="M73.09,22.91A27,27 0 0,1 73.09,61.09" stroke-opacity="0.5"/>
        <path d="M34.91,22.91A27,27 0 0,0 34.91,61.09" stroke-opacity="0.5"/>
        <path d="M66.02,29.98A17,17 0 0,1 66.02,54.02" stroke-opacity="0.92"/>
        <path d="M41.98,29.98A17,17 0 0,0 41.98,54.02" stroke-opacity="0.92"/>
      </g>
      <circle cx="54" cy="42" r="8" fill="#FFFFFF"/>
      <g fill="url(#bars)">
        <path d="M31,72a3.75,3.75 0 0,1 3.75,3.75v6.5a3.75,3.75 0 0,1 -7.5,0v-6.5a3.75,3.75 0 0,1 3.75,-3.75z"/>
        <path d="M42.5,62a3.75,3.75 0 0,1 3.75,3.75v16.5a3.75,3.75 0 0,1 -7.5,0v-16.5a3.75,3.75 0 0,1 3.75,-3.75z"/>
        <path d="M54,60a3.75,3.75 0 0,1 3.75,3.75v18.5a3.75,3.75 0 0,1 -7.5,0v-18.5a3.75,3.75 0 0,1 3.75,-3.75z"/>
        <path d="M65.5,67a3.75,3.75 0 0,1 3.75,3.75v11.5a3.75,3.75 0 0,1 -7.5,0v-11.5a3.75,3.75 0 0,1 3.75,-3.75z"/>
        <path d="M77,74a3.75,3.75 0 0,1 3.75,3.75v4.5a3.75,3.75 0 0,1 -7.5,0v-4.5a3.75,3.75 0 0,1 3.75,-3.75z"/>
      </g>
    </g>
    <clipPath id="circle"><circle cx="54" cy="54" r="54"/></clipPath>
    <clipPath id="squircle"><rect x="2" y="2" width="104" height="104" rx="23"/></clipPath>
  </defs>
  <use href="#art"/>
</svg>
